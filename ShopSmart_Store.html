<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ShopSmart | CognoSpace</title>
<meta name="description" content="ShopSmart: a classroom online store for learning how e-commerce finds sales patterns. A CognoSpace experiential learning activity.">
<link rel="icon" type="image/png" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ShopSmart · marketplace look: midnight header, slate sub-nav,
   orange accents, yellow and orange action buttons, teal links.
   ========================================================= */
:root{
  --hd:#131921;--hd2:#232F3E;--hd3:#37475A;--hd4:#485769;
  --or:#FF9900;--or-d:#E47911;--or-soft:#FFF3E0;
  --yl:#FFD814;--yl-b:#FCD200;--yl-h:#F7CA00;
  --ob:#FFA41C;--ob-b:#FF8F00;--ob-h:#FA8900;
  --link:#007185;--link-h:#C7511F;
  --red:#CC0C39;--grn:#067D62;--blue:#146EB4;
  --ink:#0F1111;--mut:#565959;--mut2:#767676;--line:#D5D9D9;--line2:#E7E7E7;
  --bg:#E3E6E6;--bg2:#F0F2F2;--tile:#F7F7F7;
  --sh:0 2px 5px rgba(15,17,17,.15);
  --f:'Inter','Amazon Ember',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--f);color:var(--ink);background:#fff;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.55}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{color:var(--link-h);text-decoration:underline}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.hidden{display:none!important}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.mut{color:var(--mut)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.ab{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid transparent;transition:background .15s,box-shadow .15s,transform .1s;white-space:nowrap;line-height:1.2;text-decoration:none!important}
.ab:active:not(:disabled){transform:scale(.97)}
.ab svg{width:16px;height:16px}
.ab-y{background:var(--yl);border-color:var(--yl-b);color:var(--ink);box-shadow:0 2px 5px rgba(213,217,217,.5)}
.ab-y:hover:not(:disabled){background:var(--yl-h);color:var(--ink)}
.ab-o{background:var(--ob);border-color:var(--ob-b);color:var(--ink)}
.ab-o:hover:not(:disabled){background:var(--ob-h);color:var(--ink)}
.ab-w{background:#fff;border-color:var(--line);color:var(--ink);box-shadow:0 2px 5px rgba(213,217,217,.5)}
.ab-w:hover:not(:disabled){background:#F7FAFA;color:var(--ink)}
.ab-d{background:var(--hd2);color:#fff}
.ab-d:hover:not(:disabled){background:var(--hd3);color:#fff}
.ab-r{background:#fff;border-color:#F5B7B1;color:#B12704}
.ab-r:hover:not(:disabled){background:#B12704;color:#fff}
.ab-lg{padding:10px 20px;font-size:14px}
.ab-full{width:100%}

/* ---------- prices ---------- */
.price{font-size:24px;font-weight:500;line-height:1;white-space:nowrap}
.price sup{font-size:12px;vertical-align:top;position:relative;top:.25em;margin-right:1px}
.price.sm{font-size:18px}
.price.xs{font-size:15px}
.mrp{color:var(--mut);font-size:12px;white-space:nowrap}
.mrp s{color:var(--mut)}
.off{color:var(--red);font-weight:500}
.pct{color:var(--red);font-size:24px;font-weight:300;margin-right:6px}
.deal-badge{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:4px 7px;border-radius:2px}
.deal-lbl{color:var(--red);font-size:12px;font-weight:700}
.best-badge{display:inline-block;background:#C45500;color:#fff;font-size:11px;font-weight:600;padding:3px 8px 3px 6px;clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%)}
.deliv{font-size:12px;color:var(--mut)}
.deliv b{color:var(--ink)}
.instock{color:var(--grn);font-size:16px}

/* ---------- product image frame: every image fits ---------- */
.pimg{position:relative;container-type:inline-size;width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.pimg img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;mix-blend-mode:multiply;transition:transform .35s ease;display:block}
.pimg.tile{background:var(--tile);padding:8%}
.pimg.pad{padding:6%}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(150deg,#fff,var(--pc,#eee));border-radius:4px;text-align:center}
.ph .emo{font-size:clamp(18px,34cqw,96px);filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
.pimg.tile .ph{background:linear-gradient(150deg,#FDFDFD,var(--pc,#eee))}
.ph small{font-size:10.5px;color:var(--mut);font-family:monospace;padding:0 6px;word-break:break-all}
a:hover .pimg img,.rcard:hover .pimg img,.dcard:hover .pimg img{transform:scale(1.05)}

/* ---------- header ---------- */
.hd{background:var(--hd);color:#fff;display:flex;align-items:center;gap:4px;padding:6px 10px;height:60px;position:sticky;top:0;z-index:60}
.nb{display:flex;flex-direction:column;justify-content:center;padding:6px 8px;border:1px solid transparent;border-radius:2px;line-height:1.15;color:#fff;white-space:nowrap;text-align:left;text-decoration:none!important;flex-shrink:0}
.nb:hover{border-color:#fff;color:#fff}
.nb small{font-size:12px;color:#CCC}
.nb b{font-size:14px;font-weight:700}
.logo{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid transparent;border-radius:2px;color:#fff!important;text-decoration:none!important;flex-shrink:0}
.logo:hover{border-color:#fff}
.logo .lg-ic{width:30px;height:30px;border-radius:8px;background:var(--or);display:grid;place-items:center;color:var(--hd)}
.logo .lg-ic svg{width:19px;height:19px}
.logo .lg-t{font-size:22px;font-weight:800;letter-spacing:-.6px}
.logo .lg-t span{color:var(--or)}
.logo .lg-t em{font-style:normal;font-size:12px;font-weight:600;color:#ccc;margin-left:1px}
.cslogo{display:flex;align-items:center;padding:4px 10px 4px 12px;margin-left:2px;border:1px solid transparent;border-radius:2px;flex-shrink:0;position:relative}
.cslogo::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:1px;background:rgba(255,255,255,.25)}
.cslogo:hover{border-color:#fff}
.cslogo img{height:30px;width:auto;display:block}
.cohead .cslogo::before{background:#CCC}
.cohead .cslogo:hover{border-color:#999}
.nb.loc{flex-direction:row;align-items:flex-end;gap:2px}
.nb.loc svg{width:18px;height:18px;margin-bottom:1px}
.srch{flex:1;display:flex;height:40px;border-radius:5px;overflow:hidden;margin:0 8px;min-width:0;transition:box-shadow .15s}
.srch:focus-within{box-shadow:0 0 0 3px var(--or)}
.srch select{background:#E6E6E6;border:0;padding:0 6px 0 10px;font-size:12px;color:#555;max-width:150px;cursor:pointer;border-right:1px solid #CDCDCD}
.srch input{flex:1;border:0;padding:0 12px;font-size:15px;min-width:0;outline:none}
.srch button{width:46px;background:#FEBD69;display:grid;place-items:center;color:var(--hd);transition:background .15s}
.srch button:hover{background:#F3A847}
.srch button svg{width:22px;height:22px}
.nb.cart{flex-direction:row;align-items:flex-end;gap:2px;position:relative}
.nb.cart .ci{position:relative;width:40px;height:32px}
.nb.cart .ci svg{width:40px;height:32px}
.nb.cart .ci em{position:absolute;top:-4px;left:15px;font-style:normal;color:var(--or);font-weight:700;font-size:16px;width:20px;text-align:center}
.nb.cart b{padding-bottom:2px}
.nb.cart.bump .ci{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.2)}}
.acct{position:relative}
.acct-menu{position:absolute;right:-30px;top:calc(100% + 4px);background:#fff;color:var(--ink);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:16px;width:300px;display:none;z-index:80;animation:dropIn .2s ease}
.acct-menu::before{content:'';position:absolute;top:-8px;right:60px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
.acct:hover .acct-menu,.acct:focus-within .acct-menu{display:block}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}}
.acct-menu h4{font-size:16px;font-weight:700;margin-bottom:8px}
.acct-menu a{display:block;padding:4px 0;color:#444;font-size:13px}
.acct-menu a:hover{color:var(--link-h)}
.acct-menu .ab{margin:4px 0 10px}
.sub{background:var(--hd2);display:flex;gap:1px;padding:0 10px;height:39px;align-items:center;overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:55}
.sub::-webkit-scrollbar{display:none}
.sub a,.sub button{color:#fff;padding:5px 9px;border:1px solid transparent;border-radius:2px;white-space:nowrap;font-size:14px;font-weight:500;text-decoration:none!important;display:inline-flex;align-items:center;gap:5px}
.sub a:hover,.sub button:hover{border-color:#fff;color:#fff}
.sub .all{font-weight:700}
.sub .all svg{width:20px;height:20px}
.sub .on{border-color:var(--or)!important}
.sub .note-r{margin-left:auto;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;padding-right:6px}
.sub .note-r span{color:var(--or)}

/* side drawer */
.drw-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;animation:fade .2s}
.drw{position:fixed;left:0;top:0;bottom:0;width:340px;max-width:85vw;background:#fff;z-index:91;overflow:auto;animation:slideR .28s cubic-bezier(.2,.8,.3,1)}
@keyframes slideR{from{transform:translateX(-100%)}}
@keyframes fade{from{opacity:0}}
.drw-h{background:var(--hd3);color:#fff;padding:14px 22px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.drw-h svg{width:28px;height:28px}
.drw h5{font-size:18px;font-weight:700;padding:16px 22px 8px}
.drw a{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;color:var(--ink);font-size:14px;text-decoration:none!important}
.drw a:hover{background:#EAEDED;color:var(--ink)}
.drw a .emo{font-size:18px;margin-right:10px}
.drw hr{border:0;border-top:1px solid #D5DBDB;margin:6px 0}
.drw-x{position:fixed;left:min(350px,87vw);top:12px;z-index:92;color:#fff;width:36px;height:36px;display:grid;place-items:center}
.drw-x svg{width:28px;height:28px}

/* ---------- page shells ---------- */
.page{animation:pageIn .35s ease}
@keyframes pageIn{from{opacity:0}}
.wrapx{max-width:1500px;margin:0 auto}
.home{background:var(--bg);padding-bottom:24px}

/* hero carousel */
.hero{position:relative;height:440px;overflow:hidden;max-width:1500px;margin:0 auto}
.slide{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:space-between;padding:30px 8% 0;opacity:0;transition:opacity .9s ease;background:var(--g)}
.slide.on{opacity:1}
.slide .txt{max-width:560px;animation:none}
.slide.on .txt{animation:heroTxt .8s ease both}
@keyframes heroTxt{from{opacity:0;transform:translateX(-30px)}}
.slide .kick{display:inline-block;background:rgba(255,255,255,.9);color:var(--ink);font-size:12px;font-weight:700;padding:4px 10px;border-radius:3px;letter-spacing:.04em;text-transform:uppercase}
.slide h2{font-size:clamp(26px,3.2vw,42px);font-weight:800;line-height:1.08;margin:10px 0 8px;color:var(--tc,#0F1111);letter-spacing:-.5px}
.slide p{font-size:17px;color:var(--tc,#0F1111);opacity:.85;max-width:460px}
.slide .art{font-size:clamp(70px,10vw,150px);display:flex;gap:10px;margin-top:10px}
.slide.on .art span{animation:floatArt 4s ease-in-out infinite}
.slide .art span:nth-child(2){animation-delay:-1.3s!important}.slide .art span:nth-child(3){animation-delay:-2.6s!important}
@keyframes floatArt{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(to bottom,rgba(227,230,230,0),var(--bg));pointer-events:none;z-index:2}
.harr{position:absolute;top:0;height:250px;width:80px;z-index:3;display:grid;place-items:center;color:var(--ink);opacity:.8}
.harr:hover{opacity:1}
.harr:focus-visible{outline:3px solid #fff;outline-offset:-6px}
.harr svg{width:40px;height:40px}
.harr.l{left:0}.harr.r{right:0}
.hdots{position:absolute;left:8%;top:296px;z-index:3;display:flex;gap:6px}
.hdots button{width:10px;height:10px;border-radius:50%;background:rgba(15,17,17,.25);transition:.3s}
.hdots button.on{background:var(--ink);width:26px;border-radius:5px}

.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding:0 20px;position:relative;z-index:4;width:100%}
.boxes.up{margin-top:-120px}
.boxes+.boxes{margin-top:20px}
.box{background:#fff;padding:20px 20px 16px;display:flex;flex-direction:column;min-width:0;animation:rise .5s ease both}
.box:nth-child(2){animation-delay:.06s}.box:nth-child(3){animation-delay:.12s}.box:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.box h2{font-size:21px;font-weight:700;line-height:1.2;margin-bottom:12px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.g4 a{color:var(--ink);font-size:12px;text-decoration:none!important;min-width:0}
.g4 a span{display:block;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g4 a:hover span{color:var(--link-h)}
.box .more{font-size:13px;margin-top:auto;padding-top:14px}
.box .big1{display:block;color:var(--ink);text-decoration:none!important}
.box .big1 .pimg{aspect-ratio:1/1}
.box .sign{display:flex;flex-direction:column;gap:12px}
.box .sign .hi{display:flex;align-items:center;gap:12px}
.box .sign .av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff;background:var(--uc,#146EB4);flex-shrink:0}
.box .sign .stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box .sign .stat div{background:var(--bg2);border-radius:8px;padding:8px 10px}
.box .sign .stat small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.box .sign .stat b{font-size:17px}
.box .learn{background:linear-gradient(140deg,#FFF3E0,#E6F4F1);border-radius:10px;padding:12px;font-size:13px;margin-top:2px}
.box .learn b{display:block;font-size:14px;margin-bottom:2px}

.rowbox{background:#fff;margin:20px auto 0;width:calc(100% - 40px);max-width:1460px;padding:20px 20px 16px;position:relative;animation:rise .5s ease both}
.rowbox .rh{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.rowbox h2{font-size:21px;font-weight:700}
.rowbox .rh a{font-size:13px}
.scw{position:relative}
.scroller{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:thin;padding-bottom:10px;scroll-snap-type:x proximity}
.scroller>*{scroll-snap-align:start}
.sca{position:absolute;top:calc(50% - 50px);height:100px;width:44px;background:rgba(255,255,255,.95);box-shadow:0 1px 4px rgba(0,0,0,.25);border-radius:4px;display:grid;place-items:center;z-index:2;opacity:0;transition:opacity .2s}
.scw:hover .sca{opacity:1}
.sca svg{width:26px;height:26px}
.sca.l{left:0}.sca.r{right:0}
.dcard{flex:0 0 210px;color:var(--ink);text-decoration:none!important;min-width:0}
.dcard .pimg{height:210px;aspect-ratio:auto;background:var(--tile);padding:10%;border-radius:4px}
.dcard .dl{display:flex;align-items:center;gap:8px;margin-top:8px}
.dcard .t{font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.dcard:hover .t{color:var(--link-h)}
.dcard .pr{margin-top:4px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.icard{flex:0 0 170px;text-decoration:none!important;color:var(--ink)}
.icard .pimg{height:170px;aspect-ratio:auto;padding:6%}
.icard .pr{margin-top:6px}
.icard small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank{position:absolute;left:0;top:0;background:#E7E9EC;color:var(--ink);font-weight:800;font-size:13px;padding:2px 8px;border-radius:0 0 6px 0;z-index:1}
.cattile{flex:0 0 150px;text-align:center;color:var(--ink);text-decoration:none!important}
.cattile .ct{width:130px;height:130px;margin:0 auto;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:58px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.cattile:hover .ct{transform:scale(1.08) rotate(-4deg)}
.cattile b{display:block;margin-top:8px;font-size:14px;font-weight:600}
.cattile small{color:var(--mut);font-size:12px}
.backtop{display:block;width:100%;background:var(--hd3);color:#fff;text-align:center;padding:15px 0;font-size:13px;font-weight:500;margin-top:0}
.backtop:hover{background:var(--hd4)}

/* ---------- results ---------- */
.rbar{border-bottom:1px solid var(--line2);box-shadow:0 2px 4px rgba(0,0,0,.06);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.rbar b.q{color:var(--link-h)}
.rbar select{margin-left:auto;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#F0F2F2;box-shadow:0 2px 5px rgba(15,17,17,.15);cursor:pointer}
.res{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding:16px 20px;max-width:1500px;margin:0 auto}
.filt h4{font-size:14px;font-weight:700;margin:16px 0 6px}
.filt h4:first-child{margin-top:0}
.filt a{display:block;padding:3px 0;color:var(--ink);font-size:14px}
.filt a.on{font-weight:700}
.filt a:hover{color:var(--link-h)}
.filt label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.filt input[type=checkbox]{width:16px;height:16px;accent-color:var(--link)}
.filt .pr2{display:flex;gap:6px;margin-top:6px}
.filt .pr2 input{width:76px;padding:6px 8px;border:1px solid #888C8C;border-radius:8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.rcard{border:1px solid var(--line2);border-radius:4px;display:flex;flex-direction:column;background:#fff;transition:box-shadow .2s;min-width:0;animation:rise .4s ease both;position:relative;overflow:hidden}
.rcard:hover{box-shadow:0 4px 14px rgba(15,17,17,.14)}
.rcard .im{display:block;background:var(--tile)}
.rcard .im .pimg{background:var(--tile);padding:10%}
.rcard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.rcard .t{font-size:15.5px;color:var(--ink);line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rcard .t:hover{color:var(--link-h)}
.rcard .bought{font-size:12px;color:var(--mut)}
.rcard .pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.rcard .ab{align-self:flex-start;margin-top:auto}
.rcard .bb{position:absolute;left:0;top:10px;z-index:2}
.rcard .qtyx{margin-top:auto;align-self:flex-start}
.qpill{display:inline-flex;align-items:center;border:3px solid var(--yl);border-radius:20px;overflow:hidden;height:34px;background:#fff}
.qpill button{width:34px;height:28px;display:grid;place-items:center;color:var(--ink)}
.qpill button:hover{background:#F7F7F7}
.qpill button svg{width:15px;height:15px}
.qpill span{min-width:28px;text-align:center;font-weight:700}
.pager{display:flex;justify-content:center;gap:4px;margin:26px 0 10px;flex-wrap:wrap}
.pager button{min-width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;padding:0 12px}
.pager button.on{border-color:var(--ink);font-weight:700}
.pager button:hover:not(.on):not(:disabled){background:#F7F7F7}
.noresult{padding:40px;text-align:center}
.noresult .emo{font-size:60px}
.noresult h3{font-size:22px;margin:10px 0 4px}

/* ---------- product page ---------- */
.crumbs{font-size:12px;color:var(--mut);padding:12px 20px 0;max-width:1500px;margin:0 auto}
.crumbs a{color:var(--mut)}
.pp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.2fr) 270px;gap:30px;padding:16px 20px 24px;max-width:1500px;margin:0 auto;align-items:start}
.pp-img{position:sticky;top:115px}
.pp-img .pimg{padding:4%;border-radius:4px;cursor:zoom-in}
.pp-img .pimg img{transition:transform .2s}
.pp-img .pimg.zoom img{transform:scale(1.8)}
.pp-img .hint{text-align:center;font-size:12px;color:var(--mut);margin-top:8px}
.pp h1{font-size:24px;font-weight:400;line-height:1.3}
.pp .store{font-size:14px;margin-top:4px}
.pp .bought{font-size:14px;margin-top:6px;color:var(--mut)}
.pp hr{border:0;border-top:1px solid var(--line2);margin:12px 0}
.pp .prow{display:flex;align-items:flex-start;gap:4px}
.pp .tax{font-size:14px;margin-top:4px}
.pp ul.about{margin:8px 0 0 18px;font-size:14px;display:grid;gap:4px}
.pp h3{font-size:16px;font-weight:700;margin-top:16px}
.buybox{border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px;position:sticky;top:115px}
.buybox select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#F0F2F2;box-shadow:0 2px 5px rgba(15,17,17,.15);width:120px;cursor:pointer}
.buybox .sec{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}
.buybox .sec svg{width:14px;height:14px}
.buybox .incart{background:#F0FAF7;border-radius:8px;padding:8px 10px;color:var(--grn);font-weight:600;font-size:13px}
.fbt{border-top:1px solid var(--line2);margin:0 auto;width:calc(100% - 40px);max-width:1460px;padding:20px 0}
.fbt h2{font-size:21px;font-weight:700;margin-bottom:4px}
.fbt .why{font-size:13px;color:var(--mut);margin-bottom:12px}
.fbt-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fbt-row .plus{font-size:28px;color:var(--mut)}
.fbt-row a{width:150px;text-decoration:none!important;color:var(--ink)}
.fbt-row a .pimg{height:150px;aspect-ratio:auto;padding:6%}
.fbt-row a small{display:block;font-size:12px;margin-top:4px}
.fbt-sum{margin-left:16px}

/* ---------- cart ---------- */
.cartpage{background:var(--bg);padding:20px;min-height:60vh}
.cartgrid.one{grid-template-columns:minmax(0,1fr)}
.cartgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;max-width:1500px;margin:0 auto;align-items:start}
.cbox{background:#fff;padding:20px 20px 14px}
.cbox h1{font-size:28px;font-weight:400}
.cbox .hdrow{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line2);padding-bottom:6px}
.cline{display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:16px;padding:14px 0;border-bottom:1px solid var(--line2);animation:rise .35s ease both}
.cline .pimg{padding:6%}
.cline .t{font-size:18px;color:var(--ink);line-height:1.3}
.cline .t:hover{color:var(--link-h)}
.cline .acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.cline .acts a{font-size:12px}
.cline .acts i{width:1px;height:14px;background:var(--line);display:inline-block}
.cline .rp{text-align:right}
.csub{text-align:right;font-size:18px;padding-top:10px}
.sidebox{background:#fff;padding:20px;display:flex;flex-direction:column;gap:12px;position:sticky;top:115px}
.sidebox .ok{color:var(--grn);font-size:12px;display:flex;gap:6px}
.sidebox .ok svg{width:18px;height:18px;flex-shrink:0}
.emptycart{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.emptycart .emo{font-size:100px}
.emptycart h2{font-size:22px;font-weight:700}

/* ---------- checkout ---------- */
.cohead{background:linear-gradient(#F7F8FA,#E7E9EC);border-bottom:1px solid #DDD;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.cohead .logo{color:var(--ink)!important}
.cohead .logo .lg-t em{color:var(--mut)}
.cohead h1{font-size:26px;font-weight:400}
.cohead .lock{color:var(--mut)}
.cohead .lock svg{width:22px;height:22px}
.cogrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;max-width:1150px;margin:20px auto;padding:0 20px;align-items:start}
.costep{display:grid;grid-template-columns:30px 220px minmax(0,1fr);gap:10px;padding:16px 0;border-bottom:1px solid var(--line2)}
.costep .n{font-size:18px;font-weight:700}
.costep h3{font-size:18px;font-weight:700}
.costep .radio{display:flex;align-items:flex-start;gap:10px;border:1px solid #FBD8B4;background:#FCF5EE;border-radius:8px;padding:12px}
.costep .radio input{accent-color:var(--or-d);margin-top:3px}
.coitems{display:grid;gap:10px}
.coitem{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center}
.coitem .pimg{padding:6%;border:1px solid var(--line2);border-radius:4px}
.cosum{border:1px solid var(--line);border-radius:8px;padding:18px;position:sticky;top:20px;display:flex;flex-direction:column;gap:8px}
.cosum .r{display:flex;justify-content:space-between;font-size:13px}
.cosum .tot{display:flex;justify-content:space-between;color:#B12704;font-size:18px;font-weight:700;border-top:1px solid var(--line2);padding-top:10px}
.cosum small{font-size:11px;color:var(--mut);text-align:center}

/* ---------- done + orders ---------- */
.donebox{max-width:1000px;margin:24px auto;padding:0 20px}
.thanks{border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;gap:16px;align-items:flex-start;animation:rise .5s ease both}
.thanks .tick{width:40px;height:40px;border-radius:50%;background:var(--grn);color:#fff;display:grid;place-items:center;flex-shrink:0;animation:pop .6s cubic-bezier(.3,1.8,.5,1) both}
.thanks .tick svg{width:24px;height:24px}
@keyframes pop{from{transform:scale(0)}}
.thanks h1{font-size:20px;color:var(--grn);font-weight:700}
.datanote{margin-top:14px;border-radius:8px;padding:14px 16px;background:linear-gradient(120deg,#FFF3E0,#E6F4F1);display:flex;gap:12px;align-items:center;font-size:14px}
.datanote .emo{font-size:30px}
.ocard{border:1px solid var(--line);border-radius:8px;margin-top:16px;overflow:hidden;animation:rise .4s ease both}
.ocard .oh{background:var(--bg2);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:28px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.ocard .oh b{display:block;color:var(--ink);font-size:14px;font-weight:500;text-transform:none}
.ocard .oh>div{text-transform:uppercase}
.ocard .oh .oid{margin-left:auto;text-align:right}
.ocard .ob{padding:14px 18px;display:grid;gap:12px}
.ocard .st{font-size:18px;font-weight:700}
.ocard .st.cx{color:#B12704}
.oline{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:14px;align-items:center}
.oline .pimg{padding:6%}
.oline a.t{font-size:14px}

/* ---------- auth ---------- */
/* sticky footer: every page fills the screen, footer sits at the bottom */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#app>main,#app>.cogrid{flex:1 0 auto}
#app>main{display:flex;flex-direction:column;padding-bottom:30px}
#app>main:has(>.home),#app>main:has(>.cartpage){padding-bottom:0}
.cartpage{padding-bottom:30px!important}
#app>main>.home,#app>main>.cartpage{flex:1 0 auto}
#app>.auth{flex:1 0 auto}
.auth{background:#fff;display:flex;flex-direction:column;align-items:center;padding:20px 16px 0}
.auth-gap{height:48px;flex-shrink:0}
.auth-top{display:flex;align-items:center;margin:6px 0 18px}
.auth-top .cslogo::before{background:#CCC}.auth-top .cslogo:hover{border-color:#999}.auth-top .cslogo img{height:36px}
.auth .logo{color:var(--ink)!important}
.auth .logo .lg-t{font-size:30px}
.auth .logo .lg-t em{color:var(--mut)}
.abox{width:100%;max-width:360px;border:1px solid #DDD;border-radius:8px;padding:20px 26px 22px;animation:rise .4s ease both}
.abox.wide{max-width:520px}
.abox h1{font-size:28px;font-weight:400;margin-bottom:12px}
.abox .f{margin-bottom:14px}
.abox label{display:block;font-weight:700;font-size:13px;margin-bottom:3px}
.abox input,.abox select{width:100%;height:33px;padding:3px 9px;border:1px solid #A6A6A6;border-top-color:#949494;border-radius:4px;box-shadow:0 1px 0 rgba(255,255,255,.5),0 1px 0 rgba(0,0,0,.07) inset;outline:0;font-size:14px;background:#fff}
.abox input:focus,.abox select:focus{border-color:#E77600;box-shadow:0 0 3px 2px rgba(228,121,17,.5)}
.abox .hint{font-size:12px;color:var(--mut);margin-top:4px}
.abox .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.abox .fine{font-size:12px;color:var(--mut);margin-top:16px;line-height:1.5}
.err{display:none;border:1px solid #C40000;border-radius:8px;padding:12px 14px 12px 44px;margin-bottom:14px;position:relative;box-shadow:0 0 0 4px #FCF4F4 inset;font-size:13px;width:100%;max-width:360px;animation:shake .35s}
.err.show{display:block}
.err b{color:#C40000;font-size:16px;font-weight:400;display:block}
.err::before{content:'!';position:absolute;left:14px;top:12px;width:20px;height:20px;border-radius:50%;background:#C40000;color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.divider{width:100%;max-width:360px;text-align:center;position:relative;margin:22px 0 14px;font-size:12px;color:var(--mut2)}
.divider::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px solid #E7E7E7}
.divider span{background:#fff;padding:0 8px;position:relative}
.auth .ab-w.ab-full{max-width:360px}
.slots{width:100%;max-width:360px;margin-top:14px;font-size:12.5px;color:var(--mut)}
.slots .bar{height:8px;border-radius:4px;background:#EEE;overflow:hidden;margin-top:5px}
.slots .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--ob));border-radius:4px;transition:width .8s}
.afoot{width:100%;border-top:1px solid #E7E7E7;background:linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,.02) 3px,#FAFAFA 3px);padding:26px 16px calc(30px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:var(--mut);flex-shrink:0}
.auth .afoot{margin-top:auto;width:calc(100% + 32px);margin-left:-16px;margin-right:-16px}
#app>.afoot{margin-top:40px}
.afoot img{height:34px;display:inline-block;margin-bottom:10px}
.afoot .links{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:center;margin-bottom:12px}
.afoot .links a{font-size:12.5px}
.pwwrap{position:relative}
.pwwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--link)}

/* ---------- footer ---------- */
.ft{background:var(--hd2);color:#DDD;flex-shrink:0}
.backtop{flex-shrink:0}
.ft-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px;max-width:1000px;margin:0 auto;padding:40px 20px 34px}
.ft h4{color:#fff;font-size:16px;font-weight:700;margin-bottom:10px}
.ft a{display:block;color:#DDD;font-size:14px;padding:3px 0}
.ft a:hover{color:#fff}
.ft-mid{border-top:1px solid #3A4553;padding:26px 20px;display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.ft-mid img{height:40px}
.ft-mid .tag{border:1px solid #848688;border-radius:3px;padding:7px 12px;font-size:13px;color:#ccc}
.ft-bot{background:var(--hd);padding:26px 20px calc(34px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:#DDD}
.ft-bot .coggy{display:inline-flex;align-items:center;gap:10px;margin-bottom:10px}
.ft-bot .coggy img{width:34px;height:34px;border-radius:50%;background:#fff;padding:2px}
.ft-bot .coggy b{color:#fff;font-size:13px}

/* added-to-cart flyout */
.flyout{position:fixed;right:0;top:0;bottom:0;width:340px;max-width:92vw;background:#fff;z-index:95;box-shadow:-4px 0 24px rgba(0,0,0,.25);padding:22px;display:flex;flex-direction:column;gap:14px;animation:slideL .3s cubic-bezier(.2,.8,.3,1)}
@keyframes slideL{from{transform:translateX(100%)}}
.flyout .ok{display:flex;align-items:center;gap:10px;color:var(--grn);font-size:18px;font-weight:700}
.flyout .ok svg{width:26px;height:26px}
.flyout .it{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center}
.flyout .it .pimg{padding:6%;border:1px solid var(--line2);border-radius:4px}
.flyout .x{position:absolute;right:14px;top:14px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.flyout .x:hover{background:#F0F2F2}
.flyout .x svg{width:18px;height:18px}
.flyout-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:94;animation:fade .2s}

/* ---------- ADMIN ---------- */
.ad-top{background:var(--hd2);color:#fff;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:60}
.ad-top .logo .lg-t{font-size:19px}
.ad-top .tag{background:var(--or);color:var(--hd);font-size:11px;font-weight:800;padding:3px 8px;border-radius:4px;letter-spacing:.06em}
.ad-top .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#C8E6C9}
.live::before{content:'';width:9px;height:9px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.ad-top .info{font-size:12.5px;color:#BFC7D2}
.ad{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 56px)}
.ad-side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.ad-side .grp{font-size:11px;font-weight:700;color:var(--mut2);letter-spacing:.08em;text-transform:uppercase;padding:12px 12px 6px}
.ad-side a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--ink);font-weight:500;font-size:14px;text-decoration:none!important;transition:background .15s;position:relative}
.ad-side a:hover{background:var(--bg2);color:var(--ink)}
.ad-side a svg{width:19px;height:19px;color:var(--mut)}
.ad-side a.on{background:var(--or-soft);color:#B35500;font-weight:700}
.ad-side a.on svg{color:var(--or-d)}
.ad-side a.on::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--or)}
.ad-side a em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:700;background:var(--bg2);border-radius:10px;padding:1px 8px;color:var(--mut)}
.ad-side .sess{margin:14px 6px 0;border-radius:10px;background:var(--bg2);padding:12px;font-size:12.5px;color:var(--mut)}
.ad-side .sess b{display:block;color:var(--ink);font-size:13.5px}
.ad-main{background:var(--bg2);padding:24px 28px 40px;min-width:0}
.ad-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ad-h h1{font-size:26px;font-weight:700;letter-spacing:-.3px}
.ad-h p{color:var(--mut);margin-top:2px;max-width:760px}
.ad-h .acts{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;min-width:0;animation:rise .45s ease both}
.panel h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 .r{margin-left:auto}
.panel .sub2{font-size:13px;color:var(--mut);margin-top:2px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
.mt{margin-top:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;overflow:hidden;animation:rise .45s ease both;min-width:0}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.kpi small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .ki{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;background:var(--cs);color:var(--c);display:grid;place-items:center}
.kpi .ki svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--bg2);color:var(--ink);white-space:nowrap}
.chip.g{background:#E3F4EE;color:var(--grn)}.chip.r{background:#FDE8EA;color:#B12704}.chip.o{background:var(--or-soft);color:#B35500}.chip.b{background:#E5F0FA;color:var(--blue)}
.chip svg{width:13px;height:13px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;background:var(--c);flex-shrink:0}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:11px 14px;border-radius:10px;background:#E5F0FA;color:#0B4F8A;margin-bottom:16px}
.note svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.note.w{background:#FFF8E1;color:#7A5300}
.note.g{background:#E3F4EE;color:var(--grn)}
.empty{padding:28px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:10px;background:#FBFBFB;font-size:13.5px}
.empty .emo{font-size:36px;display:block;margin-bottom:6px}
.filters{display:grid;grid-template-columns:1.5fr repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.filters input,.filters select,.fld input,.fld select{width:100%;padding:8px 10px;border:1px solid #A6A6A6;border-radius:8px;background:#fff;font-size:13.5px}
.filters input:focus,.filters select:focus,.fld input:focus,.fld select:focus,.tbl input:focus,.tbl select:focus{outline:0;border-color:#E77600;box-shadow:0 0 3px 2px rgba(228,121,17,.35)}
.tw{border:1px solid var(--line2);border-radius:10px;overflow:auto;margin-top:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:#F7F8F8;text-align:left;font-size:12px;font-weight:700;color:var(--mut);padding:10px 12px;white-space:nowrap;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line2)}
.tbl th.s{cursor:pointer;user-select:none}
.tbl th.s:hover{color:var(--ink)}
.tbl th .ar{opacity:.5;margin-left:3px;font-size:10px}
.tbl td{padding:9px 12px;border-bottom:1px solid #F0F0F0;vertical-align:middle}
.tbl tbody tr:hover{background:#FAFAF7}
.tbl tr.new{animation:rowNew 2.6s ease}
@keyframes rowNew{0%,45%{background:#FFF3D6}}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--mut)}
.tbl input,.tbl select{padding:6px 8px;border:1px solid #C9CCCC;border-radius:6px;background:#fff;font-size:13px;width:100%}
.tbl input[type=number]{width:90px}
.tbl tr.off{opacity:.5}
.tbl .th{width:46px}
.tbl .th .pimg{width:42px;border:1px solid var(--line2);border-radius:6px;padding:3px}
.tbl .th .ph .emo{font-size:20px}
.tbl .th .ph small{display:none}
.uchip{display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.uchip i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px;font-weight:800;background:var(--uc)}
.pg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.pg>div{display:flex;gap:6px}
.toggle{width:44px;height:24px;border-radius:12px;background:#C9CCCC;position:relative;transition:background .2s;flex-shrink:0}
.toggle::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s cubic-bezier(.3,1.5,.5,1)}
.toggle.on{background:var(--grn)}
.toggle.on::after{left:23px}
.addf{display:grid;grid-template-columns:2fr 1.3fr .8fr .8fr 1.3fr auto;gap:10px;align-items:end;margin-top:14px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--bg2);padding:1px 6px;border-radius:4px;border:1px solid var(--line2)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.kv div{background:var(--bg2);border-radius:8px;padding:10px 12px}
.kv small{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.kv b{font-size:14px;word-break:break-word}
.meter{height:10px;border-radius:5px;background:var(--bg2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--ob));border-radius:5px;animation:growW 1s both}

/* charts */
.ch{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.ch text{font-family:var(--f);font-size:11px;fill:#565959}
.ch .gl{stroke:#EEE;stroke-width:1}
.ch .axl{stroke:#C9CCCC;stroke-width:1}
.vb{transform-box:fill-box;transform-origin:bottom;animation:growY .9s cubic-bezier(.3,1.1,.5,1) both;cursor:pointer;transition:opacity .2s}
.vb:hover{opacity:.8}
@keyframes growY{from{transform:scaleY(0)}}
.ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3000;stroke-dashoffset:3000;animation:drawLn 1.8s .2s ease forwards}
@keyframes drawLn{to{stroke-dashoffset:0}}
.ar{opacity:0;animation:fade2 1s .9s forwards}
@keyframes fade2{to{opacity:1}}
.lpt{fill:#fff;stroke-width:2.5;cursor:pointer;transition:r .15s}
.lpt:hover{r:7}
.hbars{display:grid;gap:9px;margin-top:12px}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px;cursor:default}
.hb-l{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.hb-t{height:16px;border-radius:4px;background:#F2F3F3;overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:4px;animation:growW 1s cubic-bezier(.3,1.1,.5,1) both}
@keyframes growW{from{width:0}}
.hb>b{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:10px}
.donut svg{width:200px;height:200px;flex-shrink:0;animation:spinIn 1s cubic-bezier(.3,1.2,.5,1) both}
@keyframes spinIn{from{transform:rotate(-90deg) scale(.6);opacity:0}}
.donut svg circle.sg{cursor:pointer;transition:stroke-width .2s}
.donut svg circle.sg:hover{stroke-width:40}
.dleg{display:grid;gap:6px;flex:1;min-width:180px;font-size:13px}
.dleg div{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.dleg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dleg b{font-variant-numeric:tabular-nums}
.dleg em{font-style:normal;color:var(--mut);font-size:12px;width:40px;text-align:right}
.heat{border-collapse:separate;border-spacing:3px;margin-top:12px;font-size:12px}
.heat th{font-weight:600;color:var(--mut);padding:2px 6px;white-space:nowrap;text-align:left}
.heat th.c{text-align:center;font-size:18px}
.heat td{min-width:38px;height:32px;border-radius:5px;text-align:center;font-weight:700;transition:transform .15s;cursor:default}
.heat td:hover{transform:scale(1.12)}
.ins{border:1px solid #F3D9A8;background:linear-gradient(120deg,#FFF8EC,#fff);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;animation:rise .5s .1s ease both}
.ins .ii{width:36px;height:36px;border-radius:10px;background:var(--or);color:var(--hd);display:grid;place-items:center;flex-shrink:0}
.ins .ii svg{width:19px;height:19px}
.ins b{display:block;font-size:15px}
.ins small{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.ev{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap;color:var(--ink)}
.pairl{display:grid;gap:8px;margin-top:12px}
.pairl div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--bg2);animation:rise .4s both}
.pairl .pe{font-size:22px;letter-spacing:3px;white-space:nowrap}
.pairl b{font-size:13.5px;display:block}
.pairl small{font-size:12px;color:var(--mut)}
.pairl .pn{font-size:20px;font-weight:800;color:var(--or-d);text-align:right;line-height:1}
.pairl .pn small{display:block;font-size:11px;font-weight:500}
.predbox{border-radius:12px;padding:16px;background:linear-gradient(140deg,#EEF4FB,#FFF6E8);border:1px solid #D6E2EF}
.predbox h4{font-size:15px;display:flex;gap:8px;align-items:center}
.predbox h4 svg{width:18px;height:18px;color:var(--blue)}
.predbox .rowp{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.predbox select{flex:1;min-width:180px;padding:8px 10px;border-radius:8px;border:1px solid #A6A6A6;background:#fff}
.est{margin-top:12px;background:#fff;border-radius:10px;padding:12px;animation:rise .4s both}
.est .v{font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.conf{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:10px}
.lbl-est{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;color:var(--blue);background:#E5F0FA;padding:3px 9px;border-radius:10px}
.qlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.qc{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px;animation:rise .45s both;transition:border-color .3s,background .3s}
.qc.ok{border-color:#9DD4C0;background:#F4FBF8}
.qc .qt{display:flex;gap:10px;margin-bottom:12px}
.qc .qn{width:30px;height:30px;border-radius:8px;background:var(--hd2);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.qc.ok .qn{background:var(--grn)}
.qc .qt b{font-size:15px;font-weight:600}
.qopts{display:grid;gap:8px}
.qo{text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;transition:.15s}
.qo:hover:not(:disabled){border-color:var(--or);background:#FFFBF3}
.qo.right{border-color:var(--grn);background:#E3F4EE;font-weight:600}
.qo.wrong{border-color:#B12704;background:#FDE8EA;animation:shake .35s}
.qo:disabled{cursor:default}
.qo:disabled:not(.right){opacity:.55}
.qfb{margin-top:10px;font-size:13px}

/* modal + toast + tooltip */
.mbg{position:fixed;inset:0;background:rgba(15,17,17,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.modal{background:#fff;border-radius:10px;width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:popM .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes popM{from{transform:scale(.94);opacity:0}}
.modal .mh{background:#F0F2F2;border-bottom:1px solid var(--line);padding:14px 18px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;border-radius:10px 10px 0 0}
.modal .mh button{width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.modal .mh button:hover{background:#E3E6E6}
.modal .mh svg{width:16px;height:16px}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:var(--hd2);color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:rise .3s;text-align:center}
.toast.ok{background:var(--grn)}.toast.warn{background:#8A5A00}.toast.err{background:#B12704}
#tip{position:fixed;z-index:130;pointer-events:none;background:var(--hd);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;transition:opacity .12s;max-width:260px}
#tip.on{opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:125}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* responsive */
@media (max-width:1200px){.boxes{grid-template-columns:repeat(2,minmax(0,1fr))}.boxes.up{margin-top:-150px}.pp{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pp .buybox{grid-column:1/-1;position:static}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.addf{grid-template-columns:1fr 1fr 1fr}}
@media (max-width:900px){
  .hd{flex-wrap:wrap;height:auto;padding:8px 10px 10px}
  .hd .srch{order:9;flex:0 0 calc(100% - 4px);margin:6px 2px 0}
  .hd .loc,.hd .nb.ord{display:none}
  .cslogo img{height:24px}
  .hd .acct{margin-left:auto}
  .sub{top:106px}
  .res{grid-template-columns:minmax(0,1fr)}
  .filt{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px}
  .filt>div{flex:0 0 auto}
  .cartgrid,.cogrid{grid-template-columns:minmax(0,1fr)}
  .sidebox,.cosum{position:static}
  .costep{grid-template-columns:30px minmax(0,1fr)}.costep>div:last-child{grid-column:2}
  .ad{grid-template-columns:minmax(0,1fr)}
  .ad-side{position:sticky;top:56px;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px;z-index:50;border-right:0;border-bottom:1px solid var(--line)}
  .ad-side .grp,.ad-side .sess{display:none}
  .ad-side a{flex-shrink:0;white-space:nowrap}
  .ad-side a.on::before{display:none}
  .ad-main{padding:18px 14px 30px}
  .g2,.g21,.qlist{grid-template-columns:minmax(0,1fr)}
  .ad-top .info{display:none}
  .ft-cols{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .boxes.up{margin-top:-60px!important}
  .hero{height:330px}.slide{padding:26px 6% 0;flex-direction:column}.slide .art{font-size:64px}.slide p{font-size:14px}.harr{height:180px;width:50px}.hdots{top:200px}
  .boxes{grid-template-columns:minmax(0,1fr);padding:0 10px}.boxes.up{margin-top:-110px}
  .rowbox{margin:12px auto 0;width:calc(100% - 20px);padding:14px}
  .fbt{width:calc(100% - 20px)}
  .dcard{flex-basis:160px}.dcard .pimg{height:160px}
  .pp{grid-template-columns:minmax(0,1fr)}.pp-img{position:static}
  .rgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.rcard .t{font-size:13.5px}.rcard .price{font-size:20px}
  .cline{grid-template-columns:100px minmax(0,1fr)}.cline .rp{grid-column:2;text-align:left}
  .kpis,.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .filters,.addf,.kv{grid-template-columns:1fr 1fr}
  .hb{grid-template-columns:100px minmax(0,1fr) 60px}
  .logo .lg-t{font-size:19px}.logo .lg-t em{display:none}
  .nb.cart b{display:none}
  .cslogo{padding:4px 6px 4px 8px}.cslogo img{height:20px}
  .ad-top .tag{display:none}
  .ad-top .ab{padding:6px 8px!important;font-size:0}.ad-top .ab svg{margin:0}
  .abox .row2{grid-template-columns:1fr}
}
@media (max-width:900px){.ft-cols{gap:24px 20px;padding:32px 24px 28px}.ft-mid{gap:14px;padding:22px 16px}}
@media (max-width:480px){
  .ft-cols{grid-template-columns:1fr 1fr;gap:22px 16px;padding:28px 18px 24px}
  .ft h4{font-size:15px;margin-bottom:6px}.ft a{font-size:13.5px;padding:4px 0}
  .ft-mid img{height:32px}.ft-mid .tag{font-size:12px;padding:6px 10px}
  .ft-bot{font-size:11.5px;line-height:1.6}.ft-bot .coggy{flex-direction:column;gap:6px}
  .afoot img{height:30px}.auth-gap{height:32px}
  .auth-top .cslogo img{height:28px}
}
@media (max-width:340px){.ft-cols{grid-template-columns:1fr;text-align:center}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

function sha256(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a))}
var mp=Math.pow,mw=mp(2,32),r='',w=[],al=ascii.length*8,h=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pl=k.length,ic={},i,j;
for(var c=2;pl<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;h[pl]=(mp(c,.5)*mw)|0;k[pl++]=(mp(c,1/3)*mw)|0}}
ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return;w[i>>2]|=j<<((3-i)%4)*8}
w[w.length]=((al/mw)|0);w[w.length]=al;
for(j=0;j<w.length;){var W=w.slice(j,j+=16),oh=h;h=h.slice(0,8);
for(i=0;i<64;i++){var w15=W[i-15],w2=W[i-2],a=h[0],e=h[4];
var t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(W[i]=(i<16)?W[i]:(W[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+W[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0}
for(i=0;i<8;i++)h[i]=(h[i]+oh[i])|0}
for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(h[i]>>(j*8))&255;r+=((b<16)?0:'')+b.toString(16)}return r}

function pull(){
  const x=readSH();
  if(!x){if(SH){SH=null;route();toast('The shop was reset in another tab.','warn')}return}
  if(SH&&x.lastUpdate===SH.lastUpdate)return;
  const prevN=SH?SH.orders.length:0,prevSid=SH&&SH.sid;SH=x;
  if(LO.uid&&!me()){LO.uid=null;saveLO();route();return}

    if(SH.sid===prevSid&&SH.orders.length>prevN){const o=SH.orders[SH.orders.length-1];toast('New order '+o.id+' from '+uname(o.uid),'ok')}

  }else{updateHeaderCount();}
}

const imgCache={};
function imgKey(p){return p.id+'|'+(p.img||'')}
function imgCands(p){
  if(p.img&&p.img.trim()){const s=p.img.trim();return [/^(https?:|data:|\.{0,2}\/)|\//.test(s)?s:IMG_DIR+s]}
  return [IMG_DIR+p.id,IMG_DIR+slug(p.name)].flatMap(b=>IMG_EXT.map(e=>b+'.'+e));
}
function phHTML(p,hint){const c=catOf(p.cat);return `<div class="ph" style="--pc:${c.pc}"><span class="emo">${c.e}</span>${hint?`<small>${esc(hint)}</small>`:''}</div>`}
function pimg(p,cls,hint){
  const k=imgKey(p),c=imgCache[k];
  if(c===null)return `<div class="pimg ${cls||''}">${phHTML(p,hint?IMG_DIR+p.id+'.jpg':'')}</div>`;
  if(c)return `<div class="pimg ${cls||''}"><img src="${esc(c)}" alt="${esc(p.name)}" loading="lazy" decoding="async"></div>`;
  return `<div class="pimg ${cls||''}"><img src="${esc(imgCands(p)[0])}" data-k="${esc(k)}" data-pid="${p.id}" data-i="0" ${hint?'data-h="1"':''} alt="${esc(p.name)}" loading="lazy" decoding="async" onload="imgOk(this)" onerror="imgErr(this)"></div>`;
}
function imgOk(el){imgCache[el.dataset.k]=el.getAttribute('src')}
function imgErr(el){
  const p=prod(el.dataset.pid);if(!p){el.remove();return}
  const cs=imgCands(p);const i=+el.dataset.i+1;
  if(i<cs.length){el.dataset.i=i;el.src=cs[i];return}
  imgCache[el.dataset.k]=null;const w=document.createElement('div');w.innerHTML=phHTML(p,el.dataset.h?IMG_DIR+p.id+'.jpg':'');el.replaceWith(w.firstChild);
}

  const P=hashParts(),Q=hashQ(),a=P[0]||'home';

}

function renderSearch(Q){

  let list=SH.products.filter(p=>p.active&&(!c||p.cat===c)&&(!deals||disc(p)>=20)&&(!min||p.price>=min)&&(!max||p.price<=max)&&words.every(w=>(p.name+' '+catOf(p.cat).n).toLowerCase().includes(w)));

  list=list.slice().sort(S[sort]||S.feat);
  const per=24,pages=Math.max(1,Math.ceil(list.length/per)),P=clamp(pg,1,pages),slice=list.slice((P-1)*per,P*per);
  const link=o=>'#/s?'+new URLSearchParams(Object.fromEntries(Object.entries({...Q,pg:'',...o}).filter(([k,v])=>v!==''&&v!=null))).toString();

  const bands=[['','','Any price'],['','99','Under ₹100'],['100','299','₹100 to ₹299'],['300','699','₹300 to ₹699'],['700','','₹700 and above']];

    <select onchange="go('${link({sort:'__S__'}).replace(/'/g,"\\'")}'.replace('__S__',this.value))" aria-label="Sort by">${[['feat','Featured'],['low','Price: Low to High'],['high','Price: High to Low'],['disc','Biggest discount'],['best','Class best sellers']].map(([k,n])=>`<option value="${k}" ${sort===k?'selected':''}>Sort by: ${n}</option>`).join('')}</select></div>

    <div><h4>Price</h4>${bands.map(([a,b,n])=>`<a href="${link({min:a,max:b})}" class="${String(Q.min||'')===a&&String(Q.max||'')===b?'on':''}">${n}</a>`).join('')}
      <form class="pr2" onsubmit="event.preventDefault();go('${link({min:'__A__',max:'__B__'}).replace(/'/g,"\\'")}'.replace('__A__',this.a.value||'').replace('__B__',this.b.value||''))"><input name="a" type="number" min="0" placeholder="₹ Min" value="${esc(Q.min||'')}"><input name="b" type="number" min="0" placeholder="₹ Max" value="${esc(Q.max||'')}"><button class="ab ab-w">Go</button></form></div>
    <div><h4>Deals &amp; Discounts</h4><label><input type="checkbox" ${deals?'checked':''} onchange="go('${link({deals:deals?'':'1'}).replace(/'/g,"\\'")}')">Today's Deals (20% off or more)</label></div>
  </aside>

    ${pages>1?`<div class="pager"><button ${P<=1?'disabled':''} onclick="go('${link({pg:P-1})}')">‹ Previous</button>${Array.from({length:pages},(_,i)=>`<button class="${i+1===P?'on':''}" onclick="go('${link({pg:i+1})}')">${i+1}</button>`).join('')}<button ${P>=pages?'disabled':''} onclick="go('${link({pg:P+1})}')">Next ›</button></div>`:''}`

}

function addToCart(pid,q,silent){
  const p=prod(pid);if(!p||!p.active)return toast('This product is not available.','err');
  let now=0;mutate(S=>{const c=S.carts[LO.uid]||(S.carts[LO.uid]={});c[pid]=clamp((c[pid]||0)+q,0,10);now=c[pid]});
  bumpCart();if(!silent)flyout(p,now);rerenderCurrent();
}
function setQty(pid,d){mutate(S=>{const c=S.carts[LO.uid]||(S.carts[LO.uid]={});const n=clamp((c[pid]||0)+d,0,10);if(n)c[pid]=n;else delete c[pid]});bumpCart();rerenderCurrent()}
function setQtyAbs(pid,n){mutate(S=>{const c=S.carts[LO.uid]||(S.carts[LO.uid]={});n=clamp(+n,0,10);if(n)c[pid]=n;else delete c[pid]});bumpCart();rerenderCurrent()}
function addBundle(ids){ids.forEach(id=>addToCart(id,1,true));toast('Added '+ids.length+' items to your cart.','ok')}

/* ============ ANALYSIS (transparent grouping and counting) ============ */
function analyse(orders){
  const done=orders.filter(o=>o.status==='completed');
  const A={n:done.length,rev:0,units:0,lines:0,prod:{},cat:{},pairs:{},user:{},orders:done};
  done.forEach(o=>{const ids=new Set();const cu=A.user[o.uid]||(A.user[o.uid]={uid:o.uid,orders:0,spend:0,units:0,cats:{},last:0});cu.orders++;cu.spend+=o.total;cu.last=Math.max(cu.last,o.at);
    o.items.forEach(it=>{A.rev+=it.line;A.units+=it.qty;A.lines++;
      const p=A.prod[it.pid]||(A.prod[it.pid]={pid:it.pid,name:it.name,cat:it.cat,units:0,rev:0,orders:0});p.units+=it.qty;p.rev+=it.line;
      const c=A.cat[it.cat]||(A.cat[it.cat]={cat:it.cat,units:0,rev:0});c.units+=it.qty;c.rev+=it.line;
      cu.units+=it.qty;cu.cats[it.cat]=(cu.cats[it.cat]||0)+it.qty;ids.add(it.pid)});
    const arr=[...ids].sort();arr.forEach(id=>A.prod[id].orders++);
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){const k=arr[i]+'|'+arr[j];A.pairs[k]=(A.pairs[k]||0)+1}});
  Object.values(A.prod).forEach(p=>{const q=SH.products.find(x=>x.id===p.pid);if(q)p.name=q.name});
  A.aov=A.n?A.rev/A.n:0;
  A.byUnits=Object.values(A.prod).sort((a,b)=>b.units-a.units||b.rev-a.rev);
  A.byRev=Object.values(A.prod).sort((a,b)=>b.rev-a.rev||b.units-a.units);
  A.cats=Object.values(A.cat).sort((a,b)=>b.rev-a.rev);
  A.pairList=Object.entries(A.pairs).map(([k,v])=>{const [a,b]=k.split('|');return {a,b,n:v}}).sort((x,y)=>y.n-x.n);
  return A;
}

function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e}
const chEmpty=t=>`<div class="empty" style="margin-top:12px"><span class="emo">📊</span>${t||'No data yet. This chart fills in as customers check out.'}</div>`;
function vbars(rows,fmt,o={}){
  if(!rows.length||!rows.some(r=>r.v>0))return chEmpty(o.empty);
  const W=o.w||540,H=o.h||280,L=54,R=10,T=14,B=o.rot?86:34,mx=niceMax(Math.max(...rows.map(r=>r.v))),bw=(W-L-R)/rows.length;let g='';

function hbars(rows,fmt,emptyT){if(!rows.length)return chEmpty(emptyT);const mx=Math.max(1,...rows.map(r=>r.v));return `<div class="hbars">${rows.map((r,i)=>`<div class="hb" data-tip="${esc(r.label)}: ${esc(fmt(r.v))}${r.tip?' · '+esc(r.tip):''}"><span class="hb-l">${r.icon?`<span class="emo">${r.icon}</span>`:''}${esc(r.label)}</span><div class="hb-t"><i style="--w:${r.v/mx*100}%;background:${r.c};animation-delay:${i*.05}s"></i></div><b>${fmt(r.v)}</b></div>`).join('')}</div>`}

function lineChart(A,wide){

  +`<div class="note">${IC.image}<span><b>Adding photos:</b> make a folder called <span class="code">images</span> next to this HTML file. Name each photo with its product ID, like <span class="code">images/P001.jpg</span> (jpg, png, jpeg or webp). Photos are fitted into every card automatically, whatever their size or shape. Use the image file list to see every ID.</span></div>
  <div class="panel"><h3>Catalogue<span class="r" style="display:flex;gap:8px;flex-wrap:wrap"><input placeholder="Search name or ID" value="${esc(LO.pq)}" oninput="LO.pq=this.value;saveLO();clearTimeout(fT);fT=setTimeout(()=>{renderAdmin(true);const i=$('pqIn');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},280)" id="pqIn" style="padding:7px 10px;border:1px solid #A6A6A6;border-radius:8px"><select onchange="LO.pcat=this.value;saveLO();renderAdmin(true)" style="padding:7px 10px;border:1px solid #A6A6A6;border-radius:8px"><option value="">All categories</option>${CATS.map(k=>`<option value="${k.k}" ${c===k.k?'selected':''}>${k.n}</option>`).join('')}</select></span></h3>
  <div class="tw" style="max-height:640px"><table class="tbl"><thead><tr><th></th><th>ID</th><th>Name</th><th>Category</th><th>Price ₹</th><th>M.R.P ₹</th><th>Image file (optional)</th><th class="num">Sold</th><th>In shop</th></tr></thead><tbody>
  ${list.map(p=>`<tr class="${p.active?'':'off'}"><td class="th">${pimg(p,'')}</td><td class="mono">${p.id}</td><td><input value="${esc(p.name)}" maxlength="40" onchange="editP('${p.id}','name',this.value)" aria-label="Name"></td><td><select onchange="editP('${p.id}','cat',this.value)" aria-label="Category">${CATS.map(k=>`<option value="${k.k}" ${k.k===p.cat?'selected':''}>${k.n}</option>`).join('')}</select></td><td><input type="number" min="1" max="100000" value="${p.price}" onchange="editP('${p.id}','price',this.value)" aria-label="Price"></td><td><input type="number" min="1" max="100000" value="${p.mrp}" onchange="editP('${p.id}','mrp',this.value)" aria-label="MRP"></td><td><input value="${esc(p.img)}" placeholder="auto: ${p.id}.jpg" onchange="editP('${p.id}','img',this.value)" aria-label="Image file" style="min-width:150px"></td><td class="num">${A.prod[p.id]?A.prod[p.id].units:0}</td><td><button class="toggle ${p.active?'on':''}" onclick="editP('${p.id}','active',${!p.active})" aria-label="${p.active?'Hide':'Show'} ${esc(p.name)}"></button></td></tr>`).join('')}</tbody></table></div>
  <h3 style="margin-top:20px">Add a product</h3><div class="addf"><div class="fld"><label>Name</label><input id="npN" maxlength="40" placeholder="For example: Eraser"></div><div class="fld"><label>Category</label><select id="npC">${CATS.map(k=>`<option value="${k.k}">${k.n}</option>`).join('')}</select></div><div class="fld"><label>Price ₹</label><input id="npP" type="number" min="1"></div><div class="fld"><label>M.R.P ₹</label><input id="npM" type="number" min="1"></div><div class="fld"><label>Image file</label><input id="npI" placeholder="auto"></div><button class="ab ab-y" onclick="addP()">${IC.plus}Add product</button></div></div>`;
}
function editP(id,k,v){
  if(k==='name'){v=String(v).trim().slice(0,40);if(!v){toast('A product needs a name.','warn');return renderAdmin(true)}}
  if(k==='price'||k==='mrp'){v=Math.round(+v);if(!(v>=1&&v<=100000)){toast('Enter an amount between ₹1 and ₹1,00,000.','warn');return renderAdmin(true)}}
  if(k==='img')v=String(v).trim();
  mutate(S=>{const p=S.products.find(x=>x.id===id);p[k]=v;if(p.mrp<p.price)p.mrp=p.price});
  if(k==='img'||k==='active'||k==='cat')renderAdmin(true);toast('Saved.','ok');
}
function addP(){const n=$('npN').value.trim().slice(0,40),c=$('npC').value,p=Math.round(+$('npP').value),m=Math.round(+$('npM').value)||p,im=$('npI').value.trim();
  if(!n)return toast('Give the product a name.','warn');if(!(p>=1&&p<=100000))return toast('Enter a price between ₹1 and ₹1,00,000.','warn');
  let id;mutate(S=>{id='P'+String(S.nextProd++).padStart(3,'0');S.products.push({id,name:n,cat:c,price:p,mrp:Math.max(m,p),img:im,active:true})});toast(n+' added as '+id+'.','ok');renderAdmin(true)}
function exportImageList(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';download('shopsmart_image_files.csv',['product_id,product_name,category,image_file_to_add,also_accepted'].concat(SH.products.map(p=>[p.id,p.name,catOf(p.cat).n,p.img||IMG_DIR+p.id+'.jpg',IMG_DIR+slug(p.name)+'.jpg'].map(q).join(','))).join('\n'));toast('Image file list downloaded.','ok')}
function aSettings(){
  return ahead('Settings','Session details, customer limit, admin password and reset tools.')
  +`<div class="note w">${IC.shield}<span><b>Prototype mode, this browser only.</b> Everything is saved in this browser. Tabs and windows on this computer update live, but other devices will not share orders. Passwords are hashed, but this is classroom-level protection, not real security.</span></div>
  <div class="g2"><div class="panel"><h3>${IC.store}Session</h3><div class="kv"><div><small>School</small><b>${esc(SH.school)}</b></div><div><small>Grade · class</small><b>${esc(SH.grade)} · ${esc(SH.cls)}</b></div><div><small>Started</small><b>${dtm(SH.created)}</b></div><div><small>Orders</small><b>${SH.orders.length}</b></div></div>
    <div class="fld" style="margin-top:16px"><label>Maximum number of customers (currently ${SH.users.length} accounts)</label><div style="display:flex;gap:8px"><input id="stMax" type="number" min="${Math.max(1,SH.users.length)}" max="200" value="${SH.maxCustomers}"><button class="ab ab-y" onclick="saveMax()">Save</button></div></div></div>
  <div class="panel"><h3>${IC.key}Admin password</h3><div class="fld" style="margin-top:12px"><label>Current password</label><input id="stOld" type="password" autocomplete="current-password"></div><div class="fld" style="margin-top:10px"><label>New password</label><input id="stNew" type="password" autocomplete="new-password"></div><button class="ab ab-y" style="margin-top:12px" onclick="saveAdminPw()">Change password</button></div></div>
  <div class="g2 mt"><div class="panel"><h3>${IC.download}Export</h3><p class="sub2">Download every order line for worksheets or spreadsheets.</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="ab ab-y" onclick="exportCSV(true)">All sales data (CSV)</button><button class="ab ab-w" onclick="exportImageList()">Image file list</button></div></div>
  <div class="panel"><h3>${IC.refresh}Reset tools</h3><p class="sub2">Use these between groups. Export the data first if you want to keep it.</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="ab ab-r" onclick="resetModal('sales')">Reset sales data</button><button class="ab ab-r" onclick="resetModal('accounts')">Remove all customers and sales</button><button class="ab ab-w" onclick="restoreCat()">Restore default products</button><button class="ab ab-r" onclick="resetModal('all')">Delete the whole shop</button></div></div></div>`;
}
function saveMax(){const v=parseInt($('stMax').value,10);if(!(v>=Math.max(1,SH.users.length)&&v<=200))return toast('Choose between '+Math.max(1,SH.users.length)+' and 200.','warn');mutate(S=>{S.maxCustomers=v});toast('Customer limit is now '+v+'.','ok');renderAdmin(true)}
function saveAdminPw(){const o=$('stOld').value,n=$('stNew').value;if(SH.admin.hash!==hashPw(SH.admin.salt,o))return toast('The current password is incorrect.','err');if(n.length<4)return toast('The new password needs at least 4 characters.','warn');mutate(S=>{S.admin.salt=uid();S.admin.hash=hashPw(S.admin.salt,n)});toast('Admin password changed.','ok');renderAdmin(true)}
function restoreCat(){mutate(S=>{SEED.forEach(s=>{const p=S.products.find(x=>x.id===s.id);if(p)Object.assign(p,s);else S.products.push({...s})})});Object.keys(imgCache).forEach(k=>delete imgCache[k]);toast('Default products restored.','ok');renderAdmin(true)}
function resetModal(kind){const T={sales:['Reset sales data?','Every order and cart is deleted. Customer accounts and products stay.'],accounts:['Remove all customers and sales?','Every customer account, order and cart is deleted. Products stay.'],all:['Delete the whole shop?','Everything is deleted and you will set up a new shop.']}[kind];
  modal(T[0],`<p>${T[1]}</p><div class="fld" style="margin-top:14px"><label>Type RESET to confirm</label><input id="rsIn" autocomplete="off" oninput="$('rsGo').disabled=this.value.trim().toUpperCase()!=='RESET'"></div>`,`<button class="ab ab-r" id="rsGo" disabled onclick="doReset('${kind}')">${T[0].replace('?','')}</button>`);setTimeout(()=>$('rsIn').focus(),50)}
function doReset(kind){closeModal();
  if(kind==='all'){try{localStorage.removeItem(SKEY)}catch(e){}try{bc&&bc.postMessage(0)}catch(e){}SH=null;LO=JSON.parse(JSON.stringify(LO0));saveLO();toast('The shop was deleted.','ok');go('#/');return}
  mutate(S=>{S.orders=[];S.nextOrder=1;S.carts={};S.sid=uid();if(kind==='accounts')S.users=[]});LO.reveal=false;LO.guess='';LO.rec='';LO.refl={};saveLO();toast('Done. Ready for a new group!','ok');renderAdmin(true)}

/* ============ MODAL / TOOLTIP / CONFETTI ============ */
function modal(title,body,foot){$('layer').innerHTML=`<div class="mbg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-label="${esc(title)}"><div class="mh">${title}<button onclick="closeModal()" aria-label="Close">${IC.x}</button></div><div class="mb">${body}</div><div class="mf">${foot||''}<button class="ab ab-w" onclick="closeModal()">Close</button></div></div></div>`}
function closeModal(){closeLayer()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});
const tip=$('tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t){tip.textContent=t.dataset.tip;tip.classList.add('on')}else tip.classList.remove('on')});
document.addEventListener('mousemove',e=>{if(!tip.classList.contains('on'))return;const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,e.clientX+14)+'px';tip.style.top=(e.clientY+16)+'px'});
function burstConfetti(n){
  if(reduced())return;const cv=$('confetti');cv.classList.remove('hidden');cv.width=innerWidth;cv.height=innerHeight;const x=cv.getContext('2d');
  const cols=['#FF9900','#146EB4','#0E9F6E','#FFD814','#DB2777','#7C3AED'];
  const P=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*12-4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)],o:Math.random()<.4}));
  let t=0;(function f(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;if(p.o){x.beginPath();x.ellipse(0,0,p.s*.6,p.s*.5,0,0,7);x.fill()}else x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);x.restore()});
    if(++t<140)requestAnimationFrame(f);else{x.clearRect(0,0,cv.width,cv.height);cv.classList.add('hidden')}})();
}

/* ============ START ============ */
$('favicon').href=IMG_ICON;
SH=readSH();loadLO();
if(SH&&!SH.products)SH=null;
route();
</script>
